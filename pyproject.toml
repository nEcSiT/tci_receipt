[project]
name = "tci-hlc-finance"
version = "1.0.0"
description = "TCI Higher Life Center Receipt & Financial Management System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.1,<6.0",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.0",
    "weasyprint>=60.0",
    "django-environ>=0.11",
    "openpyxl>=3.1",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "requests>=2.31",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "*_test.py"]
pythonpath = [".", "apps"]
testpaths = ["tests"]
addopts = "--strict-markers -v"
