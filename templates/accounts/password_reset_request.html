{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — TCI Higher Life Center</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/tci-hlc.css' %}">
</head>
<body style="background-color: var(--surface); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">
  <div class="card" style="width: 100%; max-width: 440px; padding: 40px; box-shadow: var(--shadow-md);">
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 8px;">Reset Password</h2>
      <p style="font-size: 14px; color: var(--text-secondary);">
        Enter your email address and we'll generate a secure, single-use password reset link.
      </p>
    </div>

    <form method="post" action="{% url 'accounts:password_reset' %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_email">Email address</label>
        <input type="email" id="id_email" name="email" class="form-control" placeholder="name@tcihlc.org" required autofocus>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
        Generate Reset Link
      </button>

      <div style="text-align: center; margin-top: 20px;">
        <a href="{% url 'accounts:login' %}" style="font-size: 14px; font-weight: 600; color: var(--brand-navy);">
          &larr; Return to Sign In
        </a>
      </div>
    </form>
  </div>
</body>
</html>
