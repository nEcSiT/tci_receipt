{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — TCI Higher Life Center</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/tci-hlc.css' %}">
</head>
<body style="background-color: var(--surface); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">
  <div class="card" style="width: 100%; max-width: 440px; padding: 40px; box-shadow: var(--shadow-md);">
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 8px;">Create New Password</h2>
      <p style="font-size: 14px; color: var(--text-secondary);">
        Please choose a strong password (minimum 10 characters).
      </p>
    </div>

    {% if error %}
    <div class="alert alert-danger" style="margin-bottom: 20px;">
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" action="">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_new_password">New password</label>
        <input type="password" id="id_new_password" name="new_password" class="form-control" placeholder="••••••••••••" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="id_confirm_password">Confirm new password</label>
        <input type="password" id="id_confirm_password" name="confirm_password" class="form-control" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
        Update Password
      </button>

      <div style="text-align: center; margin-top: 20px;">
        <a href="{% url 'accounts:login' %}" style="font-size: 14px; font-weight: 600; color: var(--brand-navy);">
          &larr; Return to Sign In
        </a>
      </div>
    </form>
  </div>
</body>
</html>
