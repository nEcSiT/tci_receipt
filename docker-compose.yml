services:
  postgres:
    image: postgres:17-alpine
    container_name: tci_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tci_hlc_finance
      POSTGRES_USER: tci_user
      POSTGRES_PASSWORD: tci_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tci_user -d tci_hlc_finance"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tci_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tci_web
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=docker-compose-secret-key-change-in-production
      - DATABASE_URL=postgres://tci_user:tci_password@postgres:5432/tci_hlc_finance
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_BACKEND=local
      - STORAGE_DIR=/app/media
      - SYSTEM_ADMIN_EMAIL=admin@tcihlc.org
      - SYSTEM_ADMIN_INITIAL_PASSWORD=ChangeMeOnFirstLogin123!
      - SYSTEM_ADMIN_RECOVERY_EMAIL=admin.recovery@tcihlc.org
      - SYSTEM_ADMIN_RECOVERY_PHONE=+233200000001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tci_celery
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
      - media_data:/app/media
    environment:
      - DEBUG=True
      - SECRET_KEY=docker-compose-secret-key-change-in-production
      - DATABASE_URL=postgres://tci_user:tci_password@postgres:5432/tci_hlc_finance
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_BACKEND=local
      - STORAGE_DIR=/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  static_data:
